<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Layerview</title>
<style>
/* Layout: the board fills the screen; layer info lives in the gap between the halves. Single dark (OLED) theme on purpose. */
:root{
  --bg:#000; --cap:#141319; --cap-edge:#2b2937; --fg:#f1eef8; --sub:#c9c3da; --muted:#7f7a93; --faint:#3b3848;
  --strip:#22202c; --press:#ffffff; --warn:#ffb547;
  --font:Roboto, "Google Sans", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));transition:opacity .6s,transform 2s}
svg{width:100%;height:100%;display:block}
text{font-family:var(--font);text-anchor:middle;dominant-baseline:central}
.cap{fill:var(--cap);stroke:var(--cap-edge);stroke-width:.035}
.tap{fill:var(--fg);font-weight:600}
.sub{fill:var(--sub);font-weight:600}
.shifted{fill:var(--muted);font-weight:500}
.strip{fill:var(--strip)}
.k.empty .cap{fill:#0a0a0e;stroke:#1a1922}
.k.fall .tap{fill:var(--muted);font-weight:500}
.k.fall .sub{fill:var(--faint)}
.k.pressed .cap{fill:var(--press)!important;stroke:var(--press)!important}
.k.pressed text{fill:#000!important}
.k.pressed .strip{fill:#d9d6e3!important}
#hud .name{font-weight:700;letter-spacing:.04em}
#hud .how{fill:var(--sub);font-weight:500}
#hud .also{fill:var(--muted);font-weight:500}
#hud .status{fill:var(--warn);font-weight:500}
#empty{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font:500 20px var(--font);text-align:center;padding:24px}
body.idle #stage{opacity:.35}
body.sleep #stage{opacity:.05}
</style>
</head>
<body>
<div id="stage"><div id="empty">Waiting for layerview on the computer…</div></div>
<script>
"use strict";
// Distinct hues for layers; index 0 (base) stays neutral.
var HUES = ["#8a859c","#5aa9ff","#ffb547","#4fd6a8","#ff7f66","#c08cff","#ffd84d","#53dbe0","#ff6fae","#9bd35a","#f29b58","#8fa2ff"];
function color(i){ return HUES[i % HUES.length]; }
function mix(hex, a){ // hex blended over black with alpha a
  var n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return "rgb(" + Math.round(r * a) + "," + Math.round(g * a) + "," + Math.round(b * a) + ")";
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pretty(name){ return String(name || "").replace(/_/g, " "); }
function topLayer(bits){ var t = 0; for (var i = 0; i < 32; i++) if (bits >>> i & 1) t = i; return t; }

var layout = null, state = null, status = { kind: "searching", message: "Connecting…" }, alertMsg = null;
// Window-manager shortcuts (e.g. from the niri config), shown while their modifiers are held.
var SHORTCUTS = [], WM = "#3ad0ff";
var KEYSYM = { "←":"left", "→":"right", "↑":"up", "↓":"down", "PgUp":"page_up", "PgDn":"page_down", "Home":"home", "End":"end",
  "[":"bracketleft", "]":"bracketright", ",":"comma", ".":"period", "/":"slash", "-":"minus", "=":"equal", "Esc":"escape",
  "Space":"space", "Enter":"return", "Tab":"tab", "PrtSc":"print", "Bksp":"backspace", "Del":"delete", ";":"semicolon",
  "'":"apostrophe", "`":"grave", "\\":"backslash", "Ins":"insert" };
function keysym(label){ if (!label) return ""; return KEYSYM[label] || label.toLowerCase(); }
// Shortcut labels: up to two lines, sized to fit a key.
function wmText(el, label){
  var lines = [label], w = label.split(" ");
  if (label.length > 9 && w.length > 1) {
    var best = null;
    for (var i = 1; i < w.length; i++) {
      var a = w.slice(0, i).join(" "), b = w.slice(i).join(" "), m = Math.max(a.length, b.length);
      if (!best || m < best.m) best = { a: a, b: b, m: m };
    }
    lines = [best.a, best.b];
  }
  lines = lines.map(function(t){ return t.length > 12 ? t.slice(0, 11) + "…" : t; });
  var longest = Math.max.apply(null, lines.map(function(t){ return t.length; }));
  var fs = longest <= 5 ? 0.3 : longest <= 8 ? 0.23 : longest <= 10 ? 0.19 : 0.165;
  el.textContent = ""; el.setAttribute("font-size", fs); el.setAttribute("y", 0.06);
  lines.forEach(function(t, i){
    var ts = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
    ts.setAttribute("x", 0); ts.setAttribute("dy", i ? fs * 1.15 : -(lines.length - 1) * fs * 0.575); ts.textContent = t;
    el.appendChild(ts);
  });
}
function heldMods(m){ var h = []; if (m & 0x88) h.push("super"); if (m & 0x11) h.push("ctrl"); if (m & 0x44) h.push("alt"); if (m & 0x22) h.push("shift"); return h; }
var nodes = [], hud = null, layerIndex = {}, howTo = {}, bounds = null, posIdx = {}, legendRows = [];

// Which layer (if any) a legend switches to, and how.
function activator(l){
  if (!l) return null;
  if (l.h && layerIndex[l.h] !== undefined) {
    if (l.t === l.h) return { layer: layerIndex[l.h], how: "hold", label: "", pure: true };
    return { layer: layerIndex[l.h], how: "hold", label: l.t || "" };
  }
  if (l.t && layerIndex[l.t] !== undefined) return { layer: layerIndex[l.t], how: l.h === "toggle" ? "tap" : "hold", label: "" , pure: true };
  return null;
}

// Breadth-first from the base layer: describe how each layer is reached.
// howTo[layer] = full wording ("hold Magic  →  tap 2"); howShort[layer] = keys only ("Magic › 2").
var howShort = {}, howVerb = {}, parentOf = {};
function addRoute(m, target, verb, keys){
  if (m) parentOf[target] = m;
  howVerb[target] = verb;   // last step: "hold" = momentary, "tap"/"press" = a mode you stay in
  var step = verb + " " + keys;
  howTo[target] = howTo[m] ? howTo[m] + "  →  " + step : step;
  howShort[target] = howShort[m] ? howShort[m] + " › " + keys : keys;
}
// "Space" -> "left Space" when the base layer has that label on both halves.
function sided(k, name){
  var xs = layout.keys.map(function(q){ return q.x + q.w / 2; });
  var mid = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
  var same = layout.keys.filter(function(q){ return ((q.legends[0] || {}).t || "") === name; }).length;
  return same > 1 ? ((k.x + k.w / 2) < mid ? "left " : "right ") + name : name;
}
function computeHowTo(){
  howTo = { 0: "" }; howShort = { 0: "" }; parentOf = {};
  var queue = [0];
  while (queue.length) {
    var m = queue.shift();
    layout.keys.forEach(function(k){
      var a = activator(k.legends[m]);
      if (!a || howTo[a.layer] !== undefined) return;
      var base = (k.legends[0] && k.legends[0].t) || "";
      var keyName = a.pure ? (m === 0 ? base : (base || "?")) : a.label;
      if (a.pure && m === 0) keyName = base || pretty(layout.layers[a.layer]);
      addRoute(m, a.layer, a.how, m === 0 ? sided(k, keyName) : keyName);
      queue.push(a.layer);
    });
    (layout.combos || []).forEach(function(c){
      var a = activator(c.legend);
      if (!a || howTo[a.layer] !== undefined) return;
      if (c.layers && c.layers.length && c.layers.indexOf(m) < 0) return;
      var names = c.keys.map(function(p){ var i = posIdx[p]; var l = i !== undefined && layout.keys[i].legends[0]; return (l && l.t) || "?"; });
      addRoute(m, a.layer, c.legend.h === "toggle" ? "press" : "hold", names.join(" + "));
      queue.push(a.layer);
    });
  }
}

function build(){
  var stage = document.getElementById("stage");
  if (!layout || !layout.keys.length) return;
  layerIndex = {}; layout.layers.forEach(function(n, i){ layerIndex[n] = i; });
  posIdx = {}; layout.keys.forEach(function(k, i){ posIdx[k.pos] = i; });
  computeHowTo();
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  layout.keys.forEach(function(k){
    var p = Math.max(k.w, k.h) * 0.32;   // room for rotation + the anti-burn-in pixel shift
    minX = Math.min(minX, k.x - p); minY = Math.min(minY, k.y - p);
    maxX = Math.max(maxX, k.x + k.w + p); maxY = Math.max(maxY, k.y + k.h + p);
  });
  bounds = { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  var s = '<svg viewBox="' + minX + ' ' + minY + ' ' + (maxX - minX) + ' ' + (maxY - minY) + '" preserveAspectRatio="xMidYMid meet">';
  layout.keys.forEach(function(k, i){
    var cx = k.x + k.w / 2, cy = k.y + k.h / 2, g = 0.05, w = k.w - 2 * g, h = k.h - 2 * g;
    s += '<g class="k" transform="translate(' + cx + ' ' + cy + ') rotate(' + (k.r || 0) + ')">'
      + '<rect class="cap" x="' + (-w / 2) + '" y="' + (-h / 2) + '" width="' + w + '" height="' + h + '" rx="0.11"/>'
      + '<rect class="strip" x="' + (-w / 2 + 0.06) + '" y="' + (h / 2 - 0.33) + '" width="' + (w - 0.12) + '" height="0.27" rx="0.06"/>'
      + '<text class="shifted" x="' + (-w / 2 + 0.2) + '" y="' + (-h / 2 + 0.2) + '" font-size="0.2"></text>'
      + '<text class="tap"></text>'
      + '<text class="sub" y="' + (h / 2 - 0.195) + '" font-size="0.2"></text></g>';
  });
  // HUD in the gap between the halves, above the thumb clusters.
  var gx = (minX + maxX) / 2, leftEdge = -1e9, rightEdge = 1e9;
  layout.keys.forEach(function(k){
    if (k.y > 4.5) return;                       // the gap above the thumb clusters
    var c = k.x + k.w / 2;
    if (c < gx) leftEdge = Math.max(leftEdge, k.x + k.w); else rightEdge = Math.min(rightEdge, k.x);
  });
  var gapW = Math.max(3, rightEdge - leftEdge) - 0.3, colW = gapW / 2;
  // Layers only reachable by holding a key inside another held layer (e.g. mouse speeds)
  // are listed under their parent while it's active, not in the main list.
  var nested = function(i){ return howVerb[i] === "hold" && parentOf[i] !== undefined; };
  var entries = layout.layers.map(function(n, i){ return i; }).filter(function(i){ return i > 0 && !nested(i); });
  var perCol = Math.ceil(entries.length / 2), lh = Math.min(0.4, 2.3 / Math.max(perCol, 1));
  s += '<g id="hud"><text class="name" x="' + gx + '" y="' + (minY + 1.15) + '" font-size="0.6"></text>'
     + '<text class="how" x="' + gx + '" y="' + (minY + 1.8) + '" font-size="0.27"></text>';
  legendRows = [];
  entries.forEach(function(li, n){
    var col = n < perCol ? 0 : 1, row = n % perCol;
    var x = gx - gapW / 2 + col * colW, y = minY + 2.45 + row * lh;
    s += '<g class="lrow" data-l="' + li + '"><circle cx="' + (x + 0.1) + '" cy="' + y + '" r="0.08"/>'
       + '<text x="' + (x + 0.26) + '" y="' + y + '" font-size="' + (lh * 0.58) + '" style="text-anchor:start">'
       + '<tspan class="lname"></tspan><tspan class="lhow" dx="0.12"></tspan></text></g>';
    legendRows.push({ layer: li, max: Math.floor(colW / (lh * 0.58 * 0.52)) });
  });
  s += '<text class="status" x="' + gx + '" y="' + (minY + 2.6 + perCol * lh) + '" font-size="0.26"></text></g>';
  stage.innerHTML = s + "</svg>";
  nodes = Array.prototype.map.call(stage.querySelectorAll(".k"), function(g){
    return { g: g, cap: g.querySelector(".cap"), strip: g.querySelector(".strip"), shifted: g.querySelector(".shifted"),
             tap: g.querySelector(".tap"), sub: g.querySelector(".sub") };
  });
  var h = stage.querySelector("#hud");
  hud = { name: h.querySelector(".name"), how: h.querySelector(".how"), status: h.querySelector(".status"),
          rows: Array.prototype.slice.call(h.querySelectorAll(".lrow")) };
  render();
}

function fit(text, max){ // font size for the main legend
  var n = text.length;
  return n <= 1 ? max : n <= 2 ? max * 0.86 : n <= 4 ? max * 0.62 : n <= 6 ? max * 0.48 : max * 0.38;
}

function render(){
  if (!layout || !nodes.length) return;
  var st = state || { layers: 1, pressed: [], effective: [], shift: false };
  var top = topLayer(st.layers);
  var pressed = {}; (st.pressed || []).forEach(function(i){ pressed[i] = 1; });
  // Modifiers held that a shortcut uses (anything beyond Shift alone) -> window-manager view.
  var held = heldMods(st.mods || 0), heldKey = held.slice().sort().join("+"), wm = {};
  if (held.some(function(m){ return m !== "shift"; }))
    SHORTCUTS.forEach(function(b){ if (b.mods.slice().sort().join("+") === heldKey && !wm[b.key]) wm[b.key] = b.label; });
  var wmOn = Object.keys(wm).length > 0;

  layout.keys.forEach(function(k, i){
    var n = nodes[i];
    var eff = (st.effective && st.effective[i]) || 0;
    var l = k.legends[eff] || {};
    var tap = st.shift && l.s ? l.s : (l.t || "");
    if (tap === "▽") tap = "";
    var act = activator(l);
    var sub = l.h || "";
    var isFall = eff < top && top > 0 && howVerb[top] === "hold";   // dim fall-through only while holding a layer
    var empty = !tap && !sub;

    n.tap.textContent = tap;
    n.tap.setAttribute("font-size", fit(tap, sub ? 0.46 : 0.5));
    n.tap.setAttribute("y", sub ? -0.1 : 0);
    n.shifted.textContent = (!st.shift && l.s && l.s !== tap) ? l.s : "";
    if (act && act.pure) { tap = pretty(layout.layers[act.layer]); n.tap.textContent = tap; n.tap.setAttribute("font-size", fit(tap, 0.5)); n.tap.setAttribute("y", 0); }
    n.sub.textContent = act && !act.pure ? pretty(layout.layers[act.layer]) : (act ? "" : sub);
    n.sub.setAttribute("font-size", (n.sub.textContent.length > 8) ? 0.16 : 0.2);
    n.strip.style.display = n.sub.textContent ? "" : "none";

    // Colors: layer-entry keys show their target layer's color; active-layer keys a dark tint.
    var capFill = "", capStroke = "", stripFill = "", subFill = "";
    if (act && act.pure) {
      capFill = mix(color(act.layer), 0.32); capStroke = color(act.layer);
      stripFill = color(act.layer); subFill = "#0b0a10";
    } else if (act) {
      stripFill = color(act.layer); subFill = "#0b0a10";
    }
    if (eff > 0 && !(act && act.pure)) { capFill = mix(color(eff), 0.26); capStroke = mix(color(eff), 0.7); }
    n.cap.style.fill = capFill; n.cap.style.stroke = capStroke;
    n.strip.style.fill = stripFill; n.sub.style.fill = subFill;
    var wmLabel = wmOn ? wm[keysym(l.t)] : undefined;
    if (wmLabel !== undefined) {                       // this key + held modifiers = a shortcut
      n.shifted.textContent = l.t || "";
      wmText(n.tap, wmLabel);
      n.sub.textContent = ""; n.strip.style.display = "none";
      n.cap.style.fill = mix(WM, 0.3); n.cap.style.stroke = WM;
    }
    n.g.classList.toggle("empty", empty && !act);
    n.g.classList.toggle("fall", (isFall && !act) || (wmOn && wmLabel === undefined && !pressed[i]));
    n.g.classList.toggle("pressed", !!pressed[i]);
  });

  // HUD: current layer, how to get there, other active layers, problems.
  hud.name.textContent = wmOn ? "Window manager" : pretty(layout.layers[top] || ("Layer " + top));
  hud.name.style.fill = wmOn ? WM : color(top);
  hud.name.setAttribute("font-size", wmOn || top ? 0.6 : 0.4);        // quiet on the base layer
  hud.name.style.opacity = wmOn || top ? 1 : 0.55;
  var kids = [];
  layout.layers.forEach(function(n, i){
    if (parentOf[i] === top && howVerb[i] === "hold") {
      var key = (howShort[i] || "").split(" › ").pop(), parent = layout.layers[top];
      kids.push(key + " " + (n.indexOf(parent) === 0 ? n.slice(parent.length) : pretty(n)).toLowerCase());
    }
  });
  hud.how.textContent = wmOn ? held.map(function(m){ return m[0].toUpperCase() + m.slice(1); }).join(" + ") + " held"
    : (top ? (howTo[top] || "") + (kids.length ? "   ·   " + kids.join(" · ") : "") : "");
  hud.rows.forEach(function(g, n){
    var r = legendRows[n], li = r.layer, on = (st.layers >>> li & 1) === 1;
    var name = pretty(layout.layers[li]), how = howShort[li] === undefined ? "not reachable" : howShort[li];
    var room = r.max - name.length - 1;
    if (how.length > room) how = room > 3 ? how.slice(0, room - 1) + "…" : "";
    g.querySelector("circle").style.fill = color(li);
    var ln = g.querySelector(".lname"); ln.textContent = name; ln.style.fill = color(li);
    var lh = g.querySelector(".lhow"); lh.textContent = how;
    lh.style.fill = on ? "#f1eef8" : "#8a859c";
    g.style.opacity = on ? 1 : (top ? 0.45 : 0.85);
    ln.style.fontWeight = on ? 800 : 600;
  });
  hud.status.textContent = alertMsg || (status.kind === "live" ? "" : status.message);
  hud.status.style.fill = alertMsg ? "#ff5a4f" : "";
  hud.status.setAttribute("font-size", hud.status.textContent.length > 40 ? 0.19 : 0.26);
}

function setStatus(s){
  status = s;
  if (!layout) {
    document.getElementById("stage").innerHTML = '<div id="empty">' + esc(s.message) + '</div>';
  } else render();
}

// --- idle dimming + pixel shift (OLED burn-in care) ---
var lastActivity = Date.now();
function activity(){ lastActivity = Date.now(); document.body.classList.remove("idle", "sleep"); }
setInterval(function(){
  var idle = Date.now() - lastActivity;
  document.body.classList.toggle("idle", idle > 45000 && idle <= 600000);
  document.body.classList.toggle("sleep", idle > 600000);
}, 2000);
setInterval(function(){
  var dx = Math.round(Math.random() * 6 - 3), dy = Math.round(Math.random() * 6 - 3);
  document.getElementById("stage").style.transform = "translate(" + dx + "px," + dy + "px)";
}, 180000);

// --- live stream ---
var es = new EventSource("events"), pageId = null;
es.addEventListener("hello", function(e){
  var id = JSON.parse(e.data).page;
  if (pageId && id !== pageId) location.reload();   // bridge now serves a newer page
  pageId = id;
});
es.addEventListener("status", function(e){ setStatus(JSON.parse(e.data)); });
es.addEventListener("shortcuts", function(e){ SHORTCUTS = JSON.parse(e.data) || []; render(); });
es.addEventListener("alert", function(e){ alertMsg = JSON.parse(e.data).message; if (alertMsg) activity(); render(); });
es.addEventListener("layout", function(e){ layout = JSON.parse(e.data); build(); });
es.addEventListener("state", function(e){
  var prev = state; state = JSON.parse(e.data);
  if (!prev || prev.layers !== state.layers || (state.pressed && state.pressed.length)) activity();
  render();
});
es.onerror = function(){ setStatus({ kind: "error", message: "Bridge not reachable, retrying…" }); };
</script>
</body>
</html>
