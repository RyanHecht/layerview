[workspace]
resolver = "2"
members = ["crates/layerview-format", "crates/layerview", "crates/zmk-uf2-flash"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RyanHecht/layerview"

[workspace.dependencies]
layerview-format = { path = "crates/layerview-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
